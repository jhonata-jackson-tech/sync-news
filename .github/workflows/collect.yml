name: Coleta diária
on:
  schedule:
    # O GitHub às vezes atrasa ou descarta agendamentos. Várias tentativas; a primeira que rodar coleta.
    - cron: '17 8 * * *' # 05:17 em Brasília
    - cron: '47 8 * * *' # 05:47
    - cron: '17 9 * * *' # 06:17
    - cron: '47 9 * * *' # 06:47
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Recuperar inbox anteriores
        run: |
          mkdir -p data/inbox
          if git ls-remote --exit-code origin inbox >/dev/null; then bash scripts/fetch-inbox.sh; fi
      - name: Ver se hoje já foi coletado
        id: today
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/inbox/$(TZ=America/Sao_Paulo date +%F).json" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar
        if: steps.today.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run collect || (sleep 120 && npm run collect)
      - name: Publicar na branch inbox
        if: steps.today.outputs.done != 'true'
        run: |
          cp -r data/inbox "$RUNNER_TEMP/inbox"
          git config user.name "sync-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin inbox >/dev/null; then
            git fetch origin inbox
            git checkout -f -B inbox FETCH_HEAD
          else
            git checkout -f --orphan inbox
            git rm -rfq .
          fi
          rm -rf data
          mkdir -p data
          cp -r "$RUNNER_TEMP/inbox" data/inbox
          git add -A -f data/inbox
          git commit -qm "Inbox $(TZ=America/Sao_Paulo date +%F)" || exit 0
          git push origin inbox
